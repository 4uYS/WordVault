name: Release APK, Windows installer and single-file HTML

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 1.0.0'
        required: true
        default: '1.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

  apk:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Install dependencies
        run: npm ci

      - name: Build single-file HTML
        run: npm run build:single

      - name: Build APK
        run: bash android/build-apk.sh
        env:
          APK_VERSION: ${{ needs.prepare.outputs.version }}
          APK_VERSION_CODE: ${{ github.run_number }}
          WV_KEYSTORE_BASE64: ${{ secrets.WV_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WV_KEYSTORE_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wordvault-apk
          path: dist-android/WordVault.apk
          if-no-files-found: error

      - name: Upload single-file HTML
        uses: actions/upload-artifact@v4
        with:
          name: wordvault-single
          path: dist-single/index.html
          if-no-files-found: error

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build single-file HTML
        run: npm run build:single

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build launcher
        shell: powershell
        run: |
          & "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /out:windows\WordVault.exe /win32icon:windows\WordVault.ico windows\launcher.cs
          if (-not (Test-Path "windows\WordVault.exe")) { throw "launcher build failed" }

      - name: Build installer
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ needs.prepare.outputs.version }}" "windows\installer.iss"
          if (-not (Test-Path "dist-windows")) { throw "installer build failed" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: wordvault-windows
          path: dist-windows/WordVault-Setup-*.exe
          if-no-files-found: error

  release:
    needs: [prepare, apk, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          mkdir -p release
          cp artifacts/wordvault-apk/WordVault.apk "release/WordVault-${VERSION}.apk"
          cp artifacts/wordvault-windows/WordVault-Setup-${VERSION}.exe "release/WordVault-Setup-${VERSION}.exe"
          cp artifacts/wordvault-single/index.html "release/WordVault-${VERSION}-single.html"
          ls -lh release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: WordVault v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: release/*
          fail_on_unmatched_files: true
